<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hourly Bleed — Settings</title>
  <style>
    :root { --bg: #111; --fg: #eee; --muted: #888; --line: #2a2a2a; --red: #e33; --ok: #3a3; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 40px 16px; }
    h1 { margin: 0; font-size: 26px; }
    .tag { color: var(--muted); margin: 4px 0 32px; }
    section { padding: 20px 0; border-top: 1px solid var(--line); }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
    input { background: #1a1a1a; color: var(--fg); border: 1px solid #444; border-radius: 4px; padding: 7px 9px; font: inherit; }
    input:focus { outline: none; border-color: var(--red); }
    button { background: transparent; color: var(--fg); border: 1px solid #444; border-radius: 4px;
      padding: 7px 12px; font: inherit; cursor: pointer; }
    button:hover { border-color: var(--red); color: var(--red); }
    .inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    #rate { width: 110px; }
    #newDomain { flex: 1; min-width: 200px; }
    ul { list-style: none; padding: 0; margin: 12px 0 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
    li button { padding: 2px 8px; font-size: 12px; }
    .status { font-size: 13px; color: var(--muted); min-height: 1.5em; margin: 8px 0 0; }
    .status.ok { color: var(--ok); } .status.err { color: var(--red); }
  </style>
</head>
<body>
<main>
  <h1>Hourly Bleed</h1>
  <p class="tag">The invoice your brain refuses to open.</p>
  <p class="status ok">another shitty extension for 8.99 cracked open wide with 1 prompt.</p>

  <section>
    <h2>Your hourly rate</h2>
    <div class="inline">
      <span>$</span><input id="rate" type="number" min="0" step="1"><span>/ hr</span>
    </div>
    <p id="rateStatus" class="status"></p>
  </section>

  <section>
    <h2>Billable distractions</h2>
    <form id="addForm" class="inline">
      <input id="newDomain" type="text" placeholder="e.g. linkedin.com" autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <ul id="domains"></ul>
  </section>

  <section>
    <h2>Last 7 days</h2>
    <ul id="history"></ul>
    <p id="historyEmpty" class="status">No history yet.</p>
  </section>

  <section>
    <h2>Export</h2>
    <button id="export" type="button">Export CSV</button>
    <p class="status">Exports the last 7 days. Your receipts, itemized.</p>
  </section>
</main>
<script src="options.js"></script>
</body>
</html>
